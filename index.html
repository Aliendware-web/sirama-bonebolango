<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRAMA — Sistem Rekap Absensi Uang Makan</title>
<meta name="description" content="SIRAMA — Sistem Rekap Absensi Uang Makan Kejaksaan Negeri Bone Bolango">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden;background:#061d2b;color:#fff}
.hero{
  position:relative;width:100%;height:100vh;min-height:620px;
  background-image:
    linear-gradient(90deg,rgba(3,20,31,.94) 0%,rgba(3,24,37,.84) 34%,rgba(3,24,37,.34) 62%,rgba(3,24,37,.08) 100%),
    url('background-sirama.png');
  background-size:cover;background-position:center;
}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.18))}
.content{
  position:relative;z-index:2;height:100%;max-width:1250px;margin:auto;
  display:flex;align-items:center;padding:50px 7%;
}
.panel{max-width:650px}
.badge{
  display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;
  background:rgba(255,205,20,.13);border:1px solid rgba(255,205,20,.45);
  color:#ffd51c;font-size:13px;font-weight:700;letter-spacing:1.5px;
  margin-bottom:22px;backdrop-filter:blur(8px)
}
.badge span{width:8px;height:8px;border-radius:50%;background:#ffd51c;box-shadow:0 0 14px #ffd51c}
h1{font-size:clamp(58px,8vw,105px);line-height:.9;letter-spacing:4px;margin-bottom:12px;font-weight:900}
.subtitle{font-size:clamp(20px,2.2vw,31px);font-weight:500;line-height:1.25;margin-bottom:18px}
.office{font-size:17px;color:#d9e5e8;letter-spacing:.5px;margin-bottom:34px}
.divider{width:100px;height:4px;background:#e7b800;border-radius:10px;margin-bottom:30px}
.btn{
  display:inline-flex;align-items:center;gap:12px;padding:16px 27px;border-radius:12px;
  background:linear-gradient(135deg,#d8ad00,#f3d14a);color:#10212b;
  font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 12px 35px rgba(0,0,0,.3);
  transition:.2s ease
}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.4)}
.btn svg{width:20px;height:20px}
.note{margin-top:18px;font-size:12px;color:#c4d1d5;opacity:.85}
.footer{position:absolute;z-index:3;bottom:22px;left:7%;font-size:12px;color:#d4dde0;letter-spacing:.4px}
@media(max-width:700px){
  .content{padding:35px 8%}
  .panel{max-width:100%}
  .office{font-size:15px}
  .footer{left:8%;bottom:15px}
  .hero{background-position:62% center}
}
</style>
</head>
<body>
<section class="hero">
  <div class="overlay"></div>
  <div class="content">
    <div class="panel">
      <div class="badge"><span></span> SISTEM INFORMASI PEMBINAAN</div>
      <h1>SIRAMA</h1>
      <div class="subtitle">Sistem Rekap Absensi Uang Makan</div>
      <div class="divider"></div>
      <div class="office">Kejaksaan Negeri Bone Bolango</div>
      <a class="btn" href="https://script.google.com/macros/s/AKfycbykCrjdkctR5JBL2hor6QkPyuQQpk-qQmfCPk5uwpxM4uUPQSmQNrbhY0zI_CWxRXcS/exec" target="_self" rel="noopener">
        MASUK KE SIRAMA
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path>
        </svg>
      </a>
      <div class="note">Klik tombol untuk membuka aplikasi rekap absensi uang makan.</div>
    </div>
  </div>
  <div class="footer">© 2026 Kejaksaan Negeri Bone Bolango</div>
</section>
</body>
</html>
